[project]
name = "pyflink-workshop"
version = "0.1.0"
description = "PyFlink 1.20 + Kafka real-time ML workshop"
requires-python = ">=3.8,<3.9"

dependencies = [
    # Flink runtime (pulls PyFlink 1.20 API)
    "apache-flink==1.20.1",
    # ML stack — upper-bounds keep us on Python-3.8-compatible releases
    "numpy>=1.24.0,<2.0.0",
    "pandas>=1.5.0,<2.1.0",
    "scikit-learn>=1.3.0,<1.4.0",
    "joblib>=1.3.0,<1.4.0",
    # Standalone Kafka consumer (sklearn train/infer scripts, not Flink)
    "kafka-python>=2.0.0",
    "setuptools>=75.3.4",
]

[tool.uv]
# Resolve a fully-reproducible lock file with `uv lock`.
# Create the venv with `uv sync`.
# Run any script with `uv run python <script>.py`

[tool.uv.sources]
# No custom indices needed — all packages on PyPI.
