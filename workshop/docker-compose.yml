# Run with:  podman compose up -d
#
# Services
#   redpanda  – single-node Kafka-compatible broker  (ports 9092 advertised, 19092 host)
#   jobmanager  – Flink JobManager   (UI at http://localhost:8081)
#   taskmanager – Flink TaskManager  (2 slots)
#
# Stop:  podman compose down
# Wipe:  podman compose down -v

services:

  # ── Redpanda ─────────────────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level warn
    ports:
      - "19092:19092"   # Kafka (external)
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 15s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    environment:
      - KAFKA_BROKERS=redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Flink ─────────────────────────────────────────────────────────────────
  jobmanager:
    image: apache/flink:1.20-scala_2.12-java11
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
    volumes:
      - ..:/app   # project root mounted at /app

  taskmanager:
    image: apache/flink:1.20-scala_2.12-java11
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - jobmanager
    volumes:
      - ..:/app
